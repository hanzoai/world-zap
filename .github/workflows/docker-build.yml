name: docker-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image-name: world-zap
      registry: ghcr.io
      context: .
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit
