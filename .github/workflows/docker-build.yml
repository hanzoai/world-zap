name: docker-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/world-zap
      context: .
      dockerfile: Dockerfile
      # amd64 only — DOKS is x86, ARM ARC runner flaking on `go mod download`.
      platforms: linux/amd64
    secrets: inherit
